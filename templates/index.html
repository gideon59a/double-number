<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Double It</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    background: #f4f4f8;
  }
  .card {
    background: #fff;
    padding: 2rem 2.5rem;
    border-radius: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    text-align: center;
  }
  h1 {
    font-size: 1.25rem;
    margin-top: 0;
  }
  input, button {
    font-size: 1rem;
    padding: 0.5rem 0.75rem;
    margin: 0.5rem 0;
    width: 100%;
    box-sizing: border-box;
  }
  input {
    border: 1px solid #ccc;
    border-radius: 6px;
  }
  button {
    background: #4f46e5;
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  button:hover {
    background: #4338ca;
  }
  #result {
    background: #f0f0f7;
    font-weight: bold;
  }
  #error {
    color: #b91c1c;
    font-size: 0.875rem;
    min-height: 1.25em;
  }
  .divider {
    border: none;
    border-top: 1px solid #e5e5ea;
    margin: 1.25rem 0;
  }
  .whatsapp-btn {
    display: inline-block;
    background: #25D366;
    color: #fff;
    text-decoration: none;
    border-radius: 6px;
  }
  .whatsapp-btn:hover {
    background: #1ebe57;
  }
  .entries {
    text-align: left;
    margin-top: 0.5rem;
  }
  .entries h2 {
    font-size: 0.95rem;
    margin: 0 0 0.5rem;
  }
  .entry-link {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.5rem;
    border-radius: 8px;
    text-decoration: none;
    color: inherit;
  }
  .entry-link:hover {
    background: #f0f0f7;
  }
  .entry-link img {
    width: 40px;
    height: 40px;
    object-fit: cover;
    border-radius: 6px;
    flex-shrink: 0;
  }
  .entry-link .entry-snippet {
    font-size: 0.875rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .empty {
    color: #666;
    font-size: 0.875rem;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Double a Number</h1>
    <input type="number" id="numberInput" placeholder="Enter a number">
    <button id="doubleBtn">Double it</button>
    <input type="text" id="result" placeholder="Result" readonly>
    <div id="error"></div>

    <hr class="divider">

    <a class="whatsapp-btn" href="{{ whatsapp_group_link }}" target="_blank" rel="noopener noreferrer">
      Join WhatsApp Group
    </a>

    <hr class="divider">

    <div class="entries">
      <h2>Provider Entries</h2>
      {% for entry in entries %}
        <a class="entry-link" href="{{ url_for('entry_detail', entry_id=entry.id) }}">
          {% if entry.image_data_url %}
            <img src="{{ entry.image_data_url }}" alt="">
          {% endif %}
          <span class="entry-snippet">{{ entry.text }}</span>
        </a>
      {% else %}
        <p class="empty">No entries yet.</p>
      {% endfor %}
    </div>
  </div>

  <script>
    document.getElementById('doubleBtn').addEventListener('click', async function () {
      var input = document.getElementById('numberInput');
      var result = document.getElementById('result');
      var error = document.getElementById('error');
      error.textContent = '';
      result.value = '';

      var value = parseFloat(input.value);
      if (isNaN(value)) {
        error.textContent = 'Please enter a valid number.';
        return;
      }

      try {
        var response = await fetch('/api/double', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ number: value })
        });
        if (!response.ok) {
          throw new Error('Request failed');
        }
        var data = await response.json();
        result.value = data.result;
      } catch (err) {
        error.textContent = 'Could not reach the server.';
      }
    });
  </script>
</body>
</html>
